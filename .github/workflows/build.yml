name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Setup Android
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ || true
          mkdir -p ~/.config/godot build
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          SDKM=$(find / -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager at: $SDKM"
          yes | $SDKM --sdk_root=/usr/lib/android-sdk --licenses || true
          yes | $SDKM --sdk_root=/usr/lib/android-sdk "platform-tools" "cmdline-tools;latest" "build-tools;34.0.0" "platforms;android-34" || true
          echo "--- SDK folders ---"
          ls /usr/lib/android-sdk
          ls /usr/lib/android-sdk/build-tools
          ls /usr/lib/android-sdk/cmdline-tools
          ls /usr/lib/android-sdk/platform-tools | head -5
          echo "--- Java ---"
          ls /usr/lib/jvm
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
