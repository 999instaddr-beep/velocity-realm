name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Setup Android
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ || true
          mkdir -p ~/.config/godot build
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          SDKM=$(find /usr/lib/android-sdk /root -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager at: $SDKM"
          yes | $SDKM --sdk_root=/usr/lib/android-sdk --licenses || true
          yes | $SDKM --sdk_root=/usr/lib/android-sdk "build-tools;34.0.0" "platforms;android-34" || true
          ls /usr/lib/android-sdk/build-tools
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Export APK
        run: |
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" build/velocity-realm.apk
      - uses: actions/upload-artifact@v4
        with:
          name: velocity-realm-apk
          path: build/velocity-realm.apk
